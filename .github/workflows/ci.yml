name: РепИТ CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.lock.txt
      - run: python -m compileall -q backend/repit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: docker compose config --quiet
      - run: docker compose build --no-cache
      - run: docker compose up -d --wait
      - name: Проверить работающий API
        run: |
          python - <<'PY_API'
          import json
          from urllib.request import Request, urlopen
          from uuid import uuid4
          base = "http://127.0.0.1:8080"
          with urlopen(base + "/health/live", timeout=5) as response:
              assert response.status == 200
          with urlopen(base + "/", timeout=5) as response:
              assert "РепИТ" in response.read().decode()
          payload = {"email": uuid4().hex + "@example.org", "password": "RepITCI123!", "role": "teacher"}
          def call(path, body, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              request = Request(base + path, data=json.dumps(body).encode(), headers=headers)
              with urlopen(request, timeout=10) as response:
                  assert response.headers.get("X-Request-ID")
                  return json.loads(response.read())
          account = call("/api/auth/register/", payload)
          logged = call("/api/auth/login/", {"email": payload["email"], "password": payload["password"]})
          assert account["user"]["id"] == logged["user"]["id"]
          group = call("/api/groups/", {"title": "Проверка запуска"}, logged["access"])
          assert group["invite_code"]
          print("Frontend, Gateway, authentication, groups and request IDs verified.")
          PY_API
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
