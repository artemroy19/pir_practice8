log_format repit escape=json '{"service":"gateway","event":"http","request_id":"$request_id","path":"$uri","status":$status,"seconds":$request_time}';

server {
    listen 80;
    access_log /var/log/nginx/access.log repit;
    resolver 127.0.0.11 valid=2s ipv6=off;
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location = /health/live { return 200 "ok\n"; }
    location ~ ^/api/(auth|me|users)(/|$) {
        set $target identity-service:8000;
        proxy_pass http://$target;
    }
    location /media/ {
        set $target identity-service:8000;
        proxy_pass http://$target;
    }
    location ~ ^/api/(groups|group-memberships)(/|$) {
        set $target groups-service:8000;
        proxy_pass http://$target;
    }
    location = /api/tests/generate/ {
        set $target catalog-service:8000;
        proxy_read_timeout 75s;
        proxy_pass http://$target;
    }
    location ~ ^/api/(tests|questions|categories|assignments)(/|$) {
        set $target catalog-service:8000;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://$target;
    }
    location ~ ^/api/(attempts|essay-review-queue|essay-review-summary)(/|$) {
        set $target attempts-service:8000;
        proxy_pass http://$target;
    }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location / {
        set $target frontend:80;
        proxy_pass http://$target;
    }
}
